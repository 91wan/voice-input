name: CI/CD

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: read

jobs:

  test:
    name: ✅ Build & Test
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_16.3.app/Contents/Developer 2>/dev/null || \
          sudo xcode-select -s $(ls -d /Applications/Xcode*.app | tail -1)/Contents/Developer

      - name: Run CI gate
        run: make ci

  # ── push v* tag → macOS 编译 + DMG + GitHub Release ────────────────
  release:
    name: 🚀 Release
    runs-on: macos-15
    timeout-minutes: 20
    permissions:
      contents: write
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v6

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_16.3.app/Contents/Developer 2>/dev/null || \
          sudo xcode-select -s $(ls -d /Applications/Xcode*.app | tail -1)/Contents/Developer

      - name: Build and verify release artifact
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          make release-artifact VERSION="$VERSION" DMG_PATH=VoiceInput.dmg

      - name: Extract release notes from CHANGELOG.md
        id: notes
        run: |
          TAG="${GITHUB_REF_NAME}"
          NOTES="$(./scripts/extract-release-notes.sh CHANGELOG.md "$TAG")"
          echo "notes<<EOF" >> $GITHUB_OUTPUT
          echo "$NOTES"     >> $GITHUB_OUTPUT
          echo "EOF"        >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: ${{ github.ref_name }}
          body: ${{ steps.notes.outputs.notes }}
          files: VoiceInput.dmg
          draft: false
          prerelease: ${{ contains(github.ref_name, '-beta') || contains(github.ref_name, '-alpha') }}
