name: CI/CD

on:
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: write

jobs:

  test:
    name: ✅ Build & Test
    runs-on: macos-15
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v6

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_16.3.app/Contents/Developer 2>/dev/null || \
          sudo xcode-select -s $(ls -d /Applications/Xcode*.app | tail -1)/Contents/Developer

      - name: Run tests
        run: swift test

      - name: Build app bundle
        run: make build

  # ── Job 1：push main → 自动更新 README 日期 ──────────────────────────
  auto-doc:
    name: 📄 Auto-Doc
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update README date
        run: |
          TODAY=$(date +%Y-%m-%d)
          sed -i "s/date-[0-9]\{4\}-[0-9]\{2\}-[0-9]\{2\}/date-${TODAY}/g" README.md
          if ! git diff --quiet README.md; then
            git config --global user.name  "github-actions[bot]"
            git config --global user.email "github-actions[bot]@users.noreply.github.com"
            git add README.md
            git commit -m "docs: auto-update README date [skip ci]"
            git push
          fi

  # ── Job 2：push v* tag → macOS 编译 + DMG + GitHub Release ──────────
  release:
    name: 🚀 Release
    runs-on: macos-15
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v6

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_16.3.app/Contents/Developer 2>/dev/null || \
          sudo xcode-select -s $(ls -d /Applications/Xcode*.app | tail -1)/Contents/Developer

      - name: Build app bundle
        run: make build

      - name: Package DMG
        run: |
          ./scripts/package-dmg.sh VoiceInput.app VoiceInput.dmg VoiceInput

      - name: Verify unsigned DMG artifact
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          ./scripts/verify-dmg.sh VoiceInput.dmg "$VERSION" VoiceInput

      - name: Extract release notes from CHANGELOG.md
        id: notes
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [ -f CHANGELOG.md ]; then
            NOTES=$(awk -v tag="$TAG" '
              /^## / {
                if (found) { exit }
                heading = $0
                sub(/^##[[:space:]]+\[/, "", heading)
                sub(/^##[[:space:]]+/, "", heading)
                sub(/\].*$/, "", heading)
                sub(/[[:space:]].*$/, "", heading)
                if (heading == tag) {
                  found = 1
                  next
                }
              }
              found { print }
            ' CHANGELOG.md)
          fi
          if [ -z "$NOTES" ]; then
            NOTES="Release ${TAG}"
          fi
          echo "notes<<EOF" >> $GITHUB_OUTPUT
          echo "$NOTES"     >> $GITHUB_OUTPUT
          echo "EOF"        >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: ${{ github.ref_name }}
          body: ${{ steps.notes.outputs.notes }}
          files: VoiceInput.dmg
          draft: false
          prerelease: ${{ contains(github.ref_name, '-beta') || contains(github.ref_name, '-alpha') }}
